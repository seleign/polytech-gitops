apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3                  # Pod 2개
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 897722691159.dkr.ecr.ap-northeast-2.amazonaws.com/user77-webapp:355029a9494a9d99bb80662670a36a53779a3d1a  # ★ 1단계 URI
          ports:
            - containerPort: 80