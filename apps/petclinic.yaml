apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # 삭제 시 배포 리소스도 함께 삭제
spec:
  project: default
  source:
    repoURL: https://github.com/seleign/polytech-gitops.git
    targetRevision: HEAD
    path: petclinic
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
